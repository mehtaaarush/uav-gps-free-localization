name: uav
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # PyTorch with CUDA 12.1 for the RTX 4060
  - pytorch
  - torchvision
  - pytorch-cuda=12.1
  - pip:
      - faiss-cpu>=1.7.4
      - timm>=0.9.0
      - transformers>=4.45.0
      - opencv-python>=4.7.0
      - pillow>=9.5.0
      - numpy>=1.24.0
      - flask>=2.3.0
